<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日記 | 柳本幸子</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main>
    <div class="page-title"><h1>日記</h1><span class="it">Diario</span></div>
    <div class="filters" id="years"></div>
    <ul class="post-list" id="posts"></ul>
  </main>
  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/site.js"></script>
  <script>
    Site.header("diary");
    (async () => {
      const posts = Site.publishedPosts(await Site.load("posts"));
      const years = [...new Set(posts.map((p) => p.date.slice(0, 4)))];
      let year = "";

      function render() {
        document.getElementById("years").innerHTML = years.length > 1
          ? ["", ...years].map((y) => `<button data-y="${y}" class="${y === year ? "on" : ""}">${y ? y + "年" : "すべて"}</button>`).join("")
          : "";
        const list = posts.filter((p) => !year || p.date.startsWith(year));
        document.getElementById("posts").innerHTML = list.length
          ? list.map((p) => `
            <li><a href="post.html?id=${encodeURIComponent(p.id)}">
              <span class="d">${Site.dotDate(p.date)}</span>
              <span><span class="t">${Site.esc(p.title)}</span><span class="x">${Site.esc(p.body.replace(/\s+/g, " "))}</span></span>
            </a></li>`).join("")
          : `<li class="empty">まだ日記はありません</li>`;
      }
      document.getElementById("years").addEventListener("click", (e) => {
        if (e.target.dataset.y === undefined) return;
        year = e.target.dataset.y;
        render();
      });
      render();
    })();
  </script>
</body>
</html>
